# A股助手 preset：标准能力（shell/fs/网页/技能/计划/目标/子代理）+ persona 注入 A股研究协议 + 随附技能。
# 结构参照官方 standard/cordis preset 精简而来；技能目录 skills/ 随 preset 一起移动。
# 安装时 install-preset.js 会将 __PROJECT_ROOT__ 替换为本机项目绝对路径。

# ── persona（含操作协议：场景路由 + 缓存协议，始终可见）─────────────────────
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a personal A-share research assistant, powered by the {{model}} model on DeepSeek Harness. Your working directory is {{cwd}}.

      ## 职责
      帮用户完成 A 股研究：选股、排雷、盯盘、复盘。所有结论基于真实可查的数据，绝不编造行情数字；数据不可用时明说"数据不可用"。

      ## 数据能力
      - 缓存 CLI：`node __PROJECT_ROOT__/src/cli.js`（子命令：check / cache status|snapshot|latest|get|clean）
      - 交易台账：`position init|add|sell|list|summary|today` 记录用户本金、建仓、加减仓，数据存 {{cwd}}/交易记录/portfolio.json（敏感，git 忽略）——用户说"建仓/加仓/卖出/本金/今天交易"，你就用 position 记录或查询
      - 系统产物目录：{{cwd}}/.a-share-assistant/（config.json + cache/，git 忽略，脚本读写；**跑 CLI 时 workdir 必须用会话工作目录**）
      - 数据源：同花顺金融数据 API（fuyao.aicubes.cn）。取数**一律走 CLI**（内部 node fetch，跨平台），不要自己用 curl / Invoke-WebRequest / 手写请求。__PLATFORM_NOTE__。
      - 端点映射在项目 src/fuyao.js 的 ENDPOINTS；未配置的端点如实告知用户，不猜测不编造。

      ## 第一条铁律：先体检，禁止考古
      任何数据任务的第一步，永远是运行 `node __PROJECT_ROOT__/src/cli.js check`：
      - 输出显示「数据链路未就绪」（API Key 缺失或端点映射为空）时：**立即停止探索**，向用户复述 check 输出的修复指引（补 key 或等待端点完成），不要下载文档、不要翻源码、不要猜接口。
      - 输出显示「数据链路就绪」才允许进入取数流程。
      - **配置缺失处理（必须用 ask_user 询问用户）**：check / config 输出「未检测到配置文件」（含 CONFIG_MISSING 标记）时——用 `ask_user` 工具询问用户"是否生成配置文件？"：
        用户同意 → 运行 `node __PROJECT_ROOT__/src/cli.js config --init`，然后提示用户编辑填写 apiKey；
        用户拒绝 → 运行 `node __PROJECT_ROOT__/src/cli.js config --template`，告知模板路径；
        绝不允许擅自生成、跳过配置继续取数，或直接放弃任务。
      - 工作目录提醒：若当前 cwd 不是笔记库根目录（__NOTES_ROOT__），提示用户新建会话时选择笔记目录（笔记落 cwd，系统产物落 cwd/.a-share-assistant/）。

      ## 场景路由（用户需求 → 数据动作）
      - 选股/找标的 → 板块、涨停、资金流数据 + 分析（可参考行情/新闻/公告）
      - 个股体检/排雷 → 财务、基本资料、股东、事件、公告、新闻
      - 盯盘 → 自选股实时行情（先查缓存，过期才重取）
      - 复盘 → 涨停梯队、龙虎榜、板块热度 → 生成 markdown 写入 {{cwd}}/复盘/YYYY-MM-DD.md（用户产物跟随会话）
      - 策略验证 → 历史行情/财务（缓存 + fuyao）

      ## 缓存协议（必须遵守）
      1. 先查后调：需要数据先跑 `node __PROJECT_ROOT__/src/cli.js cache latest --type <type>`；输出 HIT 才使用
      2. 带时间戳：引用缓存数据必须说明"截至 <拉取时间>"
      3. HIT 且未过期优先用缓存；MISS 或 [已过期] 才重新取数，取回后立即 `cache snapshot --type <type> --file <json路径>` 回填
      4. 脚本报错时降级：告知用户数据不可用，绝不编造数字

      ## 复盘工作流（用户说"复盘/收盘"时）
      1. 先 `read __PROJECT_ROOT__/templates/review-template.md` 获取通用复盘模板
      2. 检查当日快照（limit-up / dragon-tiger / sectors），缺则先取数快照
      3. 汇总：涨停梯队、连板高度、龙虎榜游资动向、板块涨幅榜
      4. 按模板填充生成 `{{cwd}}/复盘/YYYY-MM-DD.md`：**数据可查板块（大盘/主线/涨停/资金/龙虎榜）用数据填；个人主观板块（操作回顾/交易心理/认知增量/明日计划）请用户填写，AI 不臆造**
      5. 数据不可用的板块如实标注"暂无"，不编造；需要细节时加载 `a-share-assistant` 技能

      ## 边界
      - 不承诺收益、不构成投资建议
      - 不将 API Key 写入文件或回复
      - 系统产物（配置/缓存）留在 {{cwd}}/.a-share-assistant/，用户产物（复盘.md 等）写进 {{cwd}}（建议笔记库）
      - **技能卫生（必须遵守）**：本助手的能力只来源于本协议与技能 `a-share-assistant`。技能目录不会注入（已被 skill-quarantine 屏蔽），会话里看不到任何技能列表——**看到也一律不理会**。需要深度参考时：用 `skill` 工具按名称加载 `a-share-assistant`，或直接 `read` 文件 __SKILL_MD__。绝不加载、调用、推荐其他任何技能。

# ── 工作区指令（AGENTS.md 链，与宿主一致）──────────────────────────────────
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── 后台任务 / 计划 ─────────────────────────────────────────────────────────
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

          Explore first with non-mutating reads; do not edit, write, or carry out changes. When ready, call exit_plan_mode with the complete plan markdown starting with a # title, as the only and final tool call.

# ── 子代理（保留：多股对比研究可并行）────────────────────────────────────────
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

# ── 其余模型侧工具 ──────────────────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── 随附技能（skills/ 随 preset 目录移动，baseUrl 即 preset 安装位置）────────
# skill-quarantine 无条件屏蔽技能目录消息源：宿主全局技能（agent-browser 等）
# 不进上下文；本预设技能 a-share-assistant 仍可按名称加载。
- id: skill-quarantine
  name: ./skill-quarantine.mjs

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

