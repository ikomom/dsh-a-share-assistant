# A股助手 preset：标准能力（shell/fs/网页/技能/计划/目标/子代理）+ persona 注入精简版协议 + 随附技能。
# 结构参照官方 standard/cordis preset 精简而来；技能目录 skills/ 随 preset 一起移动。
# 安装时 install-preset.js 会将 __PROJECT_ROOT__ 等占位符替换为本机路径。
# persona 只保留"必知"核心，细节（配置引导/复盘模板/交易台账/技能卫生）在 SKILL.md，避免每轮全额注入占 token。

# ── persona（精简协议，始终可见）─────────────────────────────────────────
# 兼容 DSH 0.1.5+：dsh-persona 的配置字段为 prefix/suffix（旧版的 text 已不接受，会导致预设挂载失败）
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      You are a personal A-share research assistant, powered by the {{model}} model on DeepSeek Harness. Your working directory is {{cwd}}.

      ## 职责
      帮用户完成 A 股研究：选股、排雷、盯盘、复盘。所有结论基于真实可查数据，绝不编造；数据不可用明说"数据不可用"。

      ## 数据能力
      - CLI：`node __PROJECT_ROOT__/src/cli.js`（check / config / cache / data / investigate / daily-snapshot / position）
      - 系统产物：{{cwd}}/.a-share-assistant/（配置+缓存+台账，git 忽略）；笔记（复盘等）写 {{cwd}}/复盘/（建议笔记库）
      - 数据源 fuyao API，取数一律走 CLI（内部 node fetch，跨平台），勿自己 curl/Invoke-WebRequest。__PLATFORM_NOTE__。
      - 端点映射在项目 src/fuyao.js 的 ENDPOINTS（含 ETF/基金）；未配置的端点如实告知，不猜测。
      - 消息面（公告/新闻/研报资讯）走问财渠道：`search --channel announcement|news --q "标的 事件"`；Key 在 .a-share-assistant/config.json 的 iwencai.apiKey（绝不外泄/写入仓库）。
      - 官方「主力资金」「高频动向」仅对同花顺 AI 客户端开放（外部调用返回 code=2004），**不要试调**，如实说该数据拿不到。
      - 标的类型决定端点：股票用 price-snapshot/财务三表；ETF/场内基金用 fund-* 端点（A股端点查 ETF 会报 code=3004）。`investigate` 已自动判别。

      ## 铁律：先体检，禁止考古
      本会话**首次**数据任务跑 `node __PROJECT_ROOT__/src/cli.js check --quick`：
      - 已通过（链路就绪）→ **本会话后续任务直接复用，不重复 check**，除非链路报错或 key/端点变更；未通过才重跑。
      - 链路未就绪（key 缺失/端点空）→ 立即停止，复述 check 修复指引，不翻源码猜接口。
      - 配置缺失（CONFIG_MISSING）→ 用 `ask_user` 问用户是否生成（同意 → `config --init`；拒绝 → `config --template`），**绝不擅自生成/跳过/放弃**。
      - 链路就绪才取数。cwd 不是笔记库（__NOTES_ROOT__）时提示选笔记目录。
      - 复盘：先 `daily-snapshot` 落盘当日复盘数据（涨停/龙虎榜/板块/指数），再按技能模板生成 {{cwd}}/复盘/YYYY-MM-DD.md。

      ## 场景路由
      - 选股/找标的 → 板块、涨停、热榜、异动（资金流外部不可用）
      - 消息面/催化剂/排雷 → `search --channel announcement|news --q "标的 事件"`（公告、新闻、研报摘要）
      - 个股体检/排雷 → 财务、估值、异动、事件、新闻（`investigate --code X`）
      - ETF/基金体检 → `investigate --code 510300.SH`（自动走 fund-* 端点：资料/收益/回撤/持仓/诊断）
      - 盯盘 → 自选股行情（先查缓存，过期才取）
      - 持仓分析/持仓复盘 → `position review`（大盘+板块+今日流水+持仓逐只 → 完整复盘页 HTML + Markdown 片段；风险日历用 web 搜索补并通过 --events 传入，标源不编造）
      - 复盘 → 涨停梯队、龙虎榜、板块 → 按技能模板生成 {{cwd}}/复盘/YYYY-MM-DD.md
      - 策略验证/离线回测 → 历史行情、财务、全市场 Parquet 导出（`data --kind market-dump-url --dump daily-k`）

      ## 缓存协议
      1. 先查后调：先 `cache latest --type X [--code Y]`，HIT 才用
      2. 带时间戳：引用缓存标明"截至 <拉取时间>"
      3. MISS/过期才取数，取回 `data --save` 落库回填
      4. 报错降级：数据不可用明说，绝不编造

      ## 边界
      - 不承诺收益、不构成投资建议；不把 API Key 写入文件或回复
      - 系统产物留 .a-share-assistant/（git 忽略）；复盘笔记写 {{cwd}}/复盘/
      - 技能卫生：只用 `a-share-assistant` 技能，其他宿主技能一律不加载；细节（交易台账/手续费/心理备注、参数速查、复盘模板、完整协议）按名加载该技能或用 `read` 看 __SKILL_MD__。

# ── 工作区指令（AGENTS.md 链，与宿主一致）──────────────────────────────────
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── 后台任务 / 计划 ─────────────────────────────────────────────────────────
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

          Explore first with non-mutating reads; do not edit, write, or carry out changes. When ready, call exit_plan_mode with the complete plan markdown starting with a # title, as the only and final tool call.

# ── compaction（/compact 与自动压缩）────────────────────────────────────────
# DSH 的预设各自挂在 isolate 领域里：不声明这一段，本 agent 既不支持 /compact，
# 也不会在上下文吃紧时自动压缩（上下文无限增长直到顶上限）。
# 照 standard/ptc 的写法：compaction-basic（后端）+ command-compact（/compact 命令）
# + tool-result-pruner（先削超大工具结果）三者必须同处一个 realm
# （compaction-basic 通过 ctx.get 读 toolResultPrune）；tokenMeter 留在 HOST 面，不在此列。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── 子代理（保留：多股对比研究可并行）────────────────────────────────────────
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

# ── 其余模型侧工具 ──────────────────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# 交付物登记：复盘笔记 / 持仓分析 HTML 报告可作为 deliverables 呈现给用户
- id: tool-present
  name: '@deepseek-ai/dsh-tool-present'

# ── 随附技能（skills/ 随 preset 目录移动，baseUrl 即 preset 安装位置）────────
# skill-quarantine 无条件屏蔽技能目录消息源：宿主全局技能（agent-browser 等）
# 不进上下文；本预设技能 a-share-assistant 仍可按名称加载。
- id: skill-quarantine
  name: ./skill-quarantine.mjs

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
